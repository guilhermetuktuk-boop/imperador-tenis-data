name: Refresh Products (6h)

on:
  schedule:
    # A cada 6 horas — 00:00, 06:00, 12:00, 18:00 (horário UTC)
    # Ajuste conforme necessário
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Permite executar manualmente pelo botão no GitHub

# Permissões para escrever no gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install puppeteer

      - name: Run scraper
        run: node scripts/scrape-ml-list.js
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Copy output to dist
        run: |
          mkdir -p dist
          cp src/data/products.json dist/products.json
          # Criar um index.html simples para o GitHub Pages
          echo '<html><body><h1>Imperador Tênis Ofertas — Dados</h1><p>Arquivo de dados para a vitrine de produtos.</p><p><a href="products.json">products.json</a></p></body></html>' > dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: '🔄 Atualização automática de produtos [skip ci]'

      - name: Log result
        run: |
          echo "✅ Scrape concluído em $(date -u)"
          echo "📊 Total de produtos: $(cat src/data/products.json | grep -o '"totalProducts":[0-9]*' | grep -o '[0-9]*')"
          echo "🔗 JSON disponível em: https://${{ github.repository_owner }}.github.io/SEU_REPO/products.json"
